name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and required files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          assert manifest["manifest_version"] == 1
          assert manifest["action"]["popover"].startswith("https://rawcdn.githack.com/")
          assert Path("index.html").is_file()
          assert Path("icon.svg").is_file()
          assert len(manifest["name"]) <= 45
          assert len(manifest["description"]) <= 128
          print("Manifest JSON OK; popover uses an HTML-aware host.")
          PY
      - name: Check inline module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          assert match, "Inline module not found"
          Path("/tmp/extension.mjs").write_text(match.group(1))
          PY
          node --check /tmp/extension.mjs
      - name: Verify actual extension content types and availability
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text())
          Path("/tmp/popover-url").write_text(manifest["action"]["popover"])
          Path("/tmp/icon-url").write_text(manifest["action"]["icon"])
          PY
          curl -fLsS -D /tmp/popover.headers "$(cat /tmp/popover-url)" -o /tmp/popover.html
          curl -fLsS -D /tmp/icon.headers "$(cat /tmp/icon-url)" -o /tmp/icon.svg
          grep -Eiq '^content-type: *text/html([; ]|$)' /tmp/popover.headers
          grep -Eiq '^content-type: *image/svg\+xml([; ]|$)' /tmp/icon.headers
          python3 - <<'PY'
          from pathlib import Path
          html = Path("/tmp/popover.html").read_text()
          assert html.lstrip().lower().startswith("<!doctype html>")
          assert "<div class=\"app\" id=\"app\">" in html
          assert "<script type=\"module\">" in html
          assert "<svg" in Path("/tmp/icon.svg").read_text()
          print("The Owlbear popover is delivered as HTML, not plain text.")
          PY
          curl -fLsS "https://esm.sh/@owlbear-rodeo/sdk@3.1.0" -o /tmp/obr-sdk.js
          test "$(wc -c </tmp/obr-sdk.js)" -gt 100
