name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and source files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text())
          assert m["manifest_version"]==1
          assert m["action"]["popover"].startswith("https://rawcdn.githack.com/")
          assert Path("index.html").is_file()
          assert Path("style.css").is_file()
          assert Path("app.js").is_file()
          assert Path("icon.svg").is_file()
          html=Path("index.html").read_text()
          assert 'href="./style.css"' in html
          assert 'src="./app.js"' in html
          print("Manifest, HTML, stylesheet and module files exist.")
          PY
      - name: Validate application JavaScript syntax
        run: |
          cp app.js /tmp/app.mjs
          node --check /tmp/app.mjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          assert '<script type="module" src="./app.js"></script>' in html
          print("Application module linked by the HTML shell.")
          PY
      - name: Validate current public extension files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text())
          Path("/tmp/popover-url").write_text(m["action"]["popover"])
          Path("/tmp/icon-url").write_text(m["action"]["icon"])
          PY
          curl -fLsS -D /tmp/popover.headers "$(cat /tmp/popover-url)" -o /tmp/popover.html
          curl -fLsS -D /tmp/icon.headers "$(cat /tmp/icon-url)" -o /tmp/icon.svg
          echo "--- POPover response headers ---"
          cat /tmp/popover.headers
          echo "--- ICON response headers ---"
          cat /tmp/icon.headers
          grep -Eiq '^content-type: *text/html([; ]|$)' /tmp/popover.headers
          grep -Eiq '^content-type: *image/svg\+xml([; ]|$)' /tmp/icon.headers
          echo "--- POPover document references ---"
          grep -oE '(href|src)="[^"]+"' /tmp/popover.html | head -20
          grep -Eiq '<link rel="stylesheet" href="./style.css">' /tmp/popover.html
          grep -Eiq '<script type="module" src="./app.js"></script>' /tmp/popover.html
          echo "Popover HTML and icon are served with correct MIME types."
      - name: Validate public static dependencies
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/popover-url)"
          ROOT="${BASE%/index.html}"
          curl -fLsS "$ROOT/style.css" -o /tmp/style.css
          curl -fLsS "$ROOT/app.js" -o /tmp/app.js
          test "$(wc -c </tmp/style.css)" -gt 10000
          test "$(wc -c </tmp/app.js)" -gt 40000
          cp /tmp/app.js /tmp/app.mjs
          node --check /tmp/app.mjs
          curl -fLsS "https://esm.sh/@owlbear-rodeo/sdk@3.1.0" -o /tmp/obr-sdk.js
          test "$(wc -c </tmp/obr-sdk.js)" -gt 100
