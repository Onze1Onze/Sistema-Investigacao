name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and source files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text())
          assert m["manifest_version"]==1
          assert m["version"]
          assert m["action"]["popover"].startswith("https://rawcdn.githack.com/")
          assert Path("index.html").is_file()
          assert Path("style.css").is_file()
          assert Path("app.js").is_file()
          assert Path("icon.svg").is_file()
          html=Path("index.html").read_text()
          assert 'href="./style.css"' in html
          assert 'src="./app.js"' in html
          print("Manifest, HTML, stylesheet and module files exist.")
          PY
      - name: Validate application JavaScript syntax
        run: |
          cp app.js /tmp/app.mjs
          node --check /tmp/app.mjs
          echo "Local application module syntax is valid."
      - name: Validate public HTML and icon response
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("manifest.json").read_text())
          Path("/tmp/popover-url").write_text(m["action"]["popover"])
          Path("/tmp/icon-url").write_text(m["action"]["icon"])
          PY
          curl -fLsS -D /tmp/popover.headers "$(cat /tmp/popover-url)" -o /tmp/popover.html
          curl -fLsS -D /tmp/icon.headers "$(cat /tmp/icon-url)" -o /tmp/icon.svg
          python3 - <<'PY'
          from pathlib import Path
          def read(path): return Path(path).read_text(errors="replace")
          pop=read("/tmp/popover.headers").lower()
          icon=read("/tmp/icon.headers").lower()
          html=read("/tmp/popover.html")
          svg=read("/tmp/icon.svg")
          assert "200" in pop.splitlines()[0], pop.splitlines()[0]
          assert "content-type: text/html" in pop, "Unexpected popover MIME type: "+pop
          assert "200" in icon.splitlines()[0], icon.splitlines()[0]
          assert "content-type: image/svg+xml" in icon, "Unexpected icon MIME type: "+icon
          assert html.lstrip().lower().startswith("<!doctype html>"), html[:500]
          assert 'href="./style.css"' in html
          assert 'src="./app.js"' in html
          assert "<svg" in svg
          print("Public HTML and SVG have HTTP 200, correct MIME types and expected markup.")
          PY
      - name: Validate public static dependencies
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/popover-url)"
          ROOT="${BASE%/index.html}"
          curl -fLsS -D /tmp/style.headers "$ROOT/style.css" -o /tmp/public-style.css
          curl -fLsS -D /tmp/app.headers "$ROOT/app.js" -o /tmp/public-app.js
          test "$(wc -c </tmp/public-style.css)" -gt 10000
          test "$(wc -c </tmp/public-app.js)" -gt 40000
          cp /tmp/public-app.js /tmp/public-app.mjs
          node --check /tmp/public-app.mjs
          echo "Public stylesheet and module are reachable; served module syntax is valid."
          curl -fLsS "https://esm.sh/@owlbear-rodeo/sdk@3.1.0" -o /tmp/obr-sdk.js
          test "$(wc -c </tmp/obr-sdk.js)" -gt 100
